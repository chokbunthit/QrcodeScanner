<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner</title>
    <!-- 1. แก้ไขลิงก์ CDN ให้ดึงสคริปต์ html5-qrcode มาให้ถูกต้อง -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f5f7fb;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; font-size: 1.2rem; }
        #reader { width: 100%; border: none !important; }
        #reader button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 id="scanner-title">กำลังโหลดเครื่องสแกน...</h2>
    <div id="reader"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetField = urlParams.get('target') || 'asset_id';
    
    const titleEl = document.getElementById('scanner-title');
    if(targetField === 'asset_id') titleEl.innerText = 'สแกนรหัส ASSET ID';
    if(targetField === 'component_code') titleEl.innerText = 'สแกนรหัส COMPONENT CODE';

    const GOOGLE_WEB_APP_URL = "https://chokbunthit.github.io/CMMS-Smart-Service/"; 

   function onScanSuccess(decodedText, decodedResult) {
    html5QrcodeScanner.clear().then(() => {
        // ลิงก์กลับไปที่หน้าเว็บหลักของคุณบน GitHub Pages (หน้าที่มีแท็ก iframe)
        const MAIN_APP_URL = GOOGLE_WEB_APP_URL; 
        
        // วิ่งกลับไปหน้าหลักพร้อมแนบข้อมูลสแกน
        window.location.href = MAIN_APP_URL + "?action=autofill&field=" + targetField + "&value=" + encodeURIComponent(decodedText);
    }).catch(error => {
        console.error("Failed to clear scanner", error);
    });
}
    // 2. ปรับโครงสร้างตัวสแกนใหม่ เพื่อเลือกใช้กล้องหลังอย่างปลอดภัย
    let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { 
            fps: 15, // เพิ่มความเร็วในการประมวลผลภาพให้จับภาพคิวอาร์โค้ดได้ง่ายขึ้น
            qrbox: { width: 250, height: 250 },
            rememberLastUsedCamera: true,
            // เรียกใช้กล้องหลังโดยไม่ใช้คำสั่ง exact ป้องกันปัญหากล้องค้างบนบางอุปกรณ์
            videoConstraints: {
                facingMode: "environment"
            }
        }, 
        /* verbose= */ false
    );

    html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
